name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Install and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (no private dependencies, no GPU, no dataset)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyarrow

      - name: Byte-compile the package
        run: python -m compileall -q src

      - name: Check for accidental psp_helper import / private-host references
        run: |
          set -e
          # Comments/docstrings may name psp_helper as historical provenance;
          # an actual import would reintroduce the private dependency.
          if grep -rInE "^\s*(from|import)\s+psp_helper" src/; then
            echo "::error::found a psp_helper import in src/ -- this repo must not depend on the private helper package"
            exit 1
          fi
          if grep -rInE "iwi5217h|rrze\.uni-erlangen|git5\.cs\.fau\.de" --include='*.py' --include='*.yaml' --include='*.sh' .; then
            echo "::error::found a hardcoded FAU-internal reference"
            exit 1
          fi

      - name: Run tests
        run: pytest tests/ -v
